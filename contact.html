<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | RoamWild</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo">Roam<span>Wild</span></a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="destinations.html">Destinations</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="page-banner">
        <h1>Start Planning Your Journey</h1>
    </section>

    <main class="container py-4">
        <div class="contact-wrapper">
            <div class="form-container">
                <h2>Booking Inquiry</h2>
                <form id="travelForm">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">

                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">

                    <label for="tripSelect">Preferred Destination</label>
                    <select id="tripSelect">
                        <option value="general">General Inquiry</option>
                        <option value="kyoto">Kyoto Cultural Tour</option>
                        <option value="amalfi">Amalfi Coast Coastal Escape</option>
                        <option value="iceland">Icelandic Northern Lights</option>
                    </select>

                    <label for="message">Special Requests or Timeline Details</label>
                    <textarea id="message" rows="5" placeholder="Tell us about your dream trip..."></textarea>

                    <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Submit Request</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 RoamWild Travel. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
